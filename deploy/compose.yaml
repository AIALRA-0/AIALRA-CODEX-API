name: aialra-model-router

services:
  postgres:
    image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
    restart: unless-stopped
    environment:
      POSTGRES_DB: router
      POSTGRES_USER: router
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - router_postgres:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "127.0.0.1:13213:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE:-ghcr.io/aialra-0/aialra-model-router-api:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: api
    restart: unless-stopped
    user: "${ROUTER_UID:-1000}:${ROUTER_GID:-1000}"
    environment:
      HOST: 0.0.0.0
      PORT: 13210
      OPENAPI_PATH: /app/openapi/openapi.yaml
      DATABASE_URL_FILE: /run/secrets/database_url
      PAYLOAD_MASTER_KEY_FILE: /run/secrets/payload_master_key
      API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
      SESSION_PEPPER_FILE: /run/secrets/session_pepper
      BOOTSTRAP_ADMIN_TOKEN_FILE: /run/secrets/bootstrap_admin_token
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      AUTHENTIK_TRUST_PROXY: ${AUTHENTIK_TRUST_PROXY:-false}
      AUTHENTIK_REQUIRED_GROUP: ${AUTHENTIK_REQUIRED_GROUP:-aialra:access:model-router}
      JOB_SUBMISSION_ENABLED: ${JOB_SUBMISSION_ENABLED:-true}
      CHATGPT_WEB_ADAPTER_ENABLED: ${CHATGPT_WEB_ADAPTER_ENABLED:-false}
      SESSION_THREAD_TTL_MS: ${SESSION_THREAD_TTL_MS:-86400000}
      INTERNAL_PROXY_SECRET_FILE: /run/secrets/internal_proxy_secret
    secrets:
      - database_url
      - payload_master_key
      - api_key_pepper
      - session_pepper
      - bootstrap_admin_token
      - internal_proxy_secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
    ports:
      - "127.0.0.1:13210:13210"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13210/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ${WEB_IMAGE:-ghcr.io/aialra-0/aialra-model-router-web:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: web
    restart: unless-stopped
    user: "${ROUTER_UID:-1000}:${ROUTER_GID:-1000}"
    environment:
      MODEL_ROUTER_API_URL: http://api:13210
      AUTH_MODE: ${AUTH_MODE:-passkey}
      INTERNAL_PROXY_SECRET_FILE: /run/secrets/internal_proxy_secret
      EDGE_PROXY_SECRET_FILE: /run/secrets/edge_proxy_secret
    secrets:
      - internal_proxy_secret
      - edge_proxy_secret
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    ports:
      - "127.0.0.1:13211:13211"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13211/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    profiles: ["codex"]
    image: ${WORKER_IMAGE:-ghcr.io/aialra-0/aialra-model-router-worker:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: worker
    restart: unless-stopped
    user: "${ROUTER_UID:-1000}:${ROUTER_GID:-1000}"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PAYLOAD_MASTER_KEY_FILE: /run/secrets/payload_master_key
      RUNNER_API_TOKEN_FILE: /run/secrets/runner_api_token
      RUNNER_URL: http://runner:13214
      CODEX_MAX_CONCURRENCY: ${CODEX_MAX_CONCURRENCY:-1}
      CHATGPT_WEB_ADAPTER_ENABLED: ${CHATGPT_WEB_ADAPTER_ENABLED:-false}
      CHATGPT_BRIDGE_URL: http://chatgpt-browser:13216
      CHATGPT_WEB_POOL_SLOTS: ${CHATGPT_WEB_POOL_SLOTS:-a,b}
      CHATGPT_BRIDGE_API_TOKEN_FILE: /run/secrets/chatgpt_bridge_api_token
      CHATGPT_WEB_DIAGNOSTIC_TOKEN_FILE: /run/secrets/chatgpt_web_diagnostic_token
      SESSION_THREAD_TTL_MS: ${SESSION_THREAD_TTL_MS:-86400000}
      METRICS_PORT: 13212
    secrets:
      - database_url
      - payload_master_key
      - runner_api_token
      - chatgpt_bridge_api_token
      - chatgpt_web_diagnostic_token
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=${ROUTER_UID:-1000},gid=${ROUTER_GID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    networks:
      - backend
      - runner_control
      - chatgpt_control
      - metrics
    ports:
      - "127.0.0.1:13212:13212"
    read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13212/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  runner:
    profiles: ["codex"]
    image: ${RUNNER_IMAGE:-ghcr.io/aialra-0/aialra-model-router-runner:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: runner
    restart: unless-stopped
    user: "${ROUTER_UID:-1000}:${ROUTER_GID:-1000}"
    environment:
      CODEX_BIN: codex
      CODEX_HOME: /codex-auth
      CODEX_PERSIST_SESSIONS: "false"
      CODEX_SESSION_TTL_MS: ${CODEX_SESSION_TTL_MS:-86400000}
      RUNNER_MAX_CONCURRENCY: ${CODEX_MAX_CONCURRENCY:-1}
      RUNNER_PORT: 13214
      RUNNER_API_TOKEN_FILE: /run/secrets/runner_api_token
    secrets:
      - runner_api_token
    volumes:
      - ${CODEX_AUTH_DIR:?Set CODEX_AUTH_DIR to the dedicated Codex home}:/codex-auth
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=${ROUTER_UID:-1000},gid=${ROUTER_GID:-1000}
      - /workspace/jobs:rw,noexec,nosuid,size=2g,uid=${ROUTER_UID:-1000},gid=${ROUTER_GID:-1000}
    networks:
      - runner_control
      - codex_egress
    read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13214/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=aialra-codex-worker
    cap_drop:
      - ALL

  chatgpt-browser: &chatgpt-browser-base
    profiles: ["chatgpt-web"]
    image: ${CHATGPT_BROWSER_IMAGE:-ghcr.io/aialra-0/aialra-model-router-chatgpt-browser:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: chatgpt-browser
    restart: unless-stopped
    group_add:
      - "${ROUTER_GID:-1000}"
    environment: &chatgpt-browser-environment
      CHATGPT_WEB_ADAPTER_ENABLED: ${CHATGPT_WEB_ADAPTER_ENABLED:-false}
      CHATGPT_WEB_DIAGNOSTIC_ENABLED: ${CHATGPT_WEB_DIAGNOSTIC_ENABLED:-false}
      CHATGPT_WEB_MAX_CONCURRENCY: ${CHATGPT_WEB_MAX_CONCURRENCY:-1}
      CHATGPT_WEB_MIN_DISPATCH_INTERVAL_MS: ${CHATGPT_WEB_MIN_DISPATCH_INTERVAL_MS:-90000}
      CHATGPT_WEB_DEFAULT_MODEL_LABEL: ${CHATGPT_WEB_DEFAULT_MODEL_LABEL:-}
      CHATGPT_CHROMIUM_NO_SANDBOX: ${CHATGPT_CHROMIUM_NO_SANDBOX:-false}
      CHATGPT_BROWSER_EXTENSION_ENABLED: ${CHATGPT_BROWSER_EXTENSION_ENABLED:-true}
      CHATGPT_WEB_ACCOUNT_ID: account-a
      CHATGPT_BRIDGE_PORT: 13216
      CHATGPT_BRIDGE_API_TOKEN_FILE: /run/secrets/chatgpt_bridge_api_token
      CHATGPT_WEB_DIAGNOSTIC_TOKEN_FILE: /run/secrets/chatgpt_web_diagnostic_token
    secrets:
      - chatgpt_bridge_api_token
      - chatgpt_web_diagnostic_token
      - chatgpt_vnc_password
    depends_on:
      chatgpt-egress-proxy:
        condition: service_healthy
    volumes:
      - chatgpt_browser_profile:/opt/aialra-browser-home/.config/chromium
    tmpfs:
      - /tmp:rw,nosuid,size=512m,uid=1100,gid=1100
      - /run/aialra-chatgpt-bridge:rw,noexec,nosuid,size=1m,uid=1100,gid=1100
      - /run/aialra-chatgpt-extension:rw,noexec,nosuid,size=8m,uid=1100,gid=1100
      - /opt/aialra-browser-home/.cache:rw,noexec,nosuid,size=256m,uid=1100,gid=1100
      - /opt/aialra-browser-home/.local:rw,noexec,nosuid,size=32m,uid=1100,gid=1100
      - /opt/aialra-browser-home/.vnc:rw,noexec,nosuid,size=1m,uid=1100,gid=1100
      - /opt/aialra-browser-home/Downloads:rw,noexec,nosuid,size=64m,uid=1100,gid=1100
    networks:
      chatgpt_control:
        ipv4_address: ${CHATGPT_BROWSER_CONTROL_IP:-10.253.240.2}
      chatgpt_proxy: {}
    read_only: true
    shm_size: 1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13216/healthz').then(r=>process.exit([200,503].includes(r.status)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
      - seccomp=${CHATGPT_BROWSER_SECCOMP_PROFILE:-/etc/aialra-model-router/chromium-seccomp.json}
      - apparmor=aialra-chatgpt-browser
    cap_drop:
      - ALL

  chatgpt-browser-b:
    <<: *chatgpt-browser-base
    profiles: ["chatgpt-web"]
    environment:
      <<: *chatgpt-browser-environment
      CHATGPT_WEB_ACCOUNT_ID: account-b
    volumes:
      - chatgpt_browser_profile_b:/opt/aialra-browser-home/.config/chromium
    networks:
      chatgpt_control:
        ipv4_address: ${CHATGPT_BROWSER_CONTROL_IP_B:-10.253.240.3}
      chatgpt_proxy: {}

  chatgpt-browser-c:
    <<: *chatgpt-browser-base
    profiles: ["chatgpt-web-extra"]
    environment:
      <<: *chatgpt-browser-environment
      CHATGPT_WEB_ACCOUNT_ID: account-c
    volumes:
      - chatgpt_browser_profile_c:/opt/aialra-browser-home/.config/chromium
    networks:
      chatgpt_control:
        ipv4_address: ${CHATGPT_BROWSER_CONTROL_IP_C:-10.253.240.4}
      chatgpt_proxy: {}

  chatgpt-browser-d:
    <<: *chatgpt-browser-base
    profiles: ["chatgpt-web-extra"]
    environment:
      <<: *chatgpt-browser-environment
      CHATGPT_WEB_ACCOUNT_ID: account-d
    volumes:
      - chatgpt_browser_profile_d:/opt/aialra-browser-home/.config/chromium
    networks:
      chatgpt_control:
        ipv4_address: ${CHATGPT_BROWSER_CONTROL_IP_D:-10.253.240.5}
      chatgpt_proxy: {}

  chatgpt-egress-proxy:
    profiles: ["chatgpt-web"]
    image: ${CHATGPT_EGRESS_PROXY_IMAGE:-ghcr.io/aialra-0/aialra-model-router-chatgpt-egress-proxy:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Containerfile
      target: chatgpt-egress-proxy
    restart: unless-stopped
    networks:
      - chatgpt_proxy
      - chatgpt_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run:rw,noexec,nosuid,size=8m,uid=13,gid=13
      - /var/log/squid:rw,noexec,nosuid,size=32m,uid=13,gid=13
      - /var/spool/squid:rw,noexec,nosuid,size=64m,uid=13,gid=13
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/squid.pid"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  frontend:
    name: aialra_router_frontend
  backend:
    name: aialra_router_backend
    internal: true
  runner_control:
    name: aialra_router_runner_control
    internal: true
  chatgpt_control:
    name: aialra_router_chatgpt_control
    internal: true
    ipam:
      config:
        - subnet: ${CHATGPT_CONTROL_SUBNET:-10.253.240.0/28}
  chatgpt_proxy:
    name: aialra_router_chatgpt_proxy
    internal: true
    ipam:
      config:
        - subnet: ${CHATGPT_PROXY_SUBNET:-10.253.240.16/28}
  chatgpt_egress:
    name: aialra_router_chatgpt_egress
    ipam:
      config:
        - subnet: ${CHATGPT_EGRESS_SUBNET:-10.253.240.32/28}
  codex_egress:
    name: aialra_router_codex_egress
  metrics:
    name: aialra_router_metrics

volumes:
  router_postgres:
    name: aialra_router_postgres
  chatgpt_browser_profile:
    name: aialra_router_chatgpt_browser_profile
  chatgpt_browser_profile_b:
    name: aialra_router_chatgpt_browser_profile_b
  chatgpt_browser_profile_c:
    name: aialra_router_chatgpt_browser_profile_c
  chatgpt_browser_profile_d:
    name: aialra_router_chatgpt_browser_profile_d

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  payload_master_key:
    file: ${SECRETS_DIR:-./secrets}/payload_master_key
  api_key_pepper:
    file: ${SECRETS_DIR:-./secrets}/api_key_pepper
  session_pepper:
    file: ${SECRETS_DIR:-./secrets}/session_pepper
  bootstrap_admin_token:
    file: ${SECRETS_DIR:-./secrets}/bootstrap_admin_token
  internal_proxy_secret:
    file: ${SECRETS_DIR:-./secrets}/internal_proxy_secret
  edge_proxy_secret:
    file: ${SECRETS_DIR:-./secrets}/edge_proxy_secret
  runner_api_token:
    file: ${SECRETS_DIR:-./secrets}/runner_api_token
  chatgpt_bridge_api_token:
    file: ${SECRETS_DIR:-./secrets}/chatgpt_bridge_api_token
  chatgpt_web_diagnostic_token:
    file: ${SECRETS_DIR:-./secrets}/chatgpt_web_diagnostic_token
  chatgpt_vnc_password:
    file: ${SECRETS_DIR:-./secrets}/chatgpt_vnc_password
