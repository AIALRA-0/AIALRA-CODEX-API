name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [api, web, worker, runner]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Normalize the registry namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Enable Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Containerfile
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/aialra-model-router-${{ matrix.target }}:${{ github.ref_name }}
      - name: Attest the published image
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAMESPACE }}/aialra-model-router-${{ matrix.target }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
