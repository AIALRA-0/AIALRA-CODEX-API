<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic ChatGPT DOM contract</title>
    <style>
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <button data-testid="model-switcher" aria-label="Model">GPT-5 Pro</button>
      <div id="model-menu" hidden>
        <button role="option">GPT-5 Pro</button>
        <button role="option">GPT-5 Thinking</button>
      </div>
      <button aria-label="Temporary Chat on">Temporary Chat on</button>
      <div id="conversation"></div>
      <div id="prompt-textarea" role="textbox" contenteditable="true"></div>
      <button data-testid="send-button" aria-label="Send">Send</button>
    </main>
    <script>
      const modelButton = document.querySelector("[data-testid='model-switcher']");
      const menu = document.querySelector("#model-menu");
      modelButton.addEventListener("click", () => {
        menu.hidden = false;
      });
      for (const option of menu.querySelectorAll("[role='option']")) {
        option.addEventListener("click", () => {
          modelButton.textContent = option.textContent;
          menu.hidden = true;
        });
      }
      document.querySelector("[data-testid='send-button']").addEventListener("click", () => {
        const conversation = document.querySelector("#conversation");
        const user = document.createElement("article");
        user.dataset.messageAuthorRole = "user";
        user.textContent = document.querySelector("#prompt-textarea").textContent;
        const stop = document.createElement("button");
        stop.dataset.testid = "stop-button";
        stop.setAttribute("aria-label", "Stop");
        stop.textContent = "Stop";
        const message = document.createElement("article");
        message.dataset.messageAuthorRole = "assistant";
        message.textContent = "Draft";
        conversation.append(user, message, stop);
        setTimeout(() => {
          message.textContent = "SYNTHETIC_WEB_OK ";
          const source = document.createElement("a");
          source.href = "https://example.com/source";
          source.textContent = "Source";
          message.append(source);
          stop.remove();
        }, 100);
      });
    </script>
  </body>
</html>
